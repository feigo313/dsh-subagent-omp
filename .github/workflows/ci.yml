name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check vendor/out-of-process.js
      - name: Manifest validity
        run: |
          node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch) throw new Error('dsh.bundle.patch missing'); console.log('manifest OK')"
          node -e "JSON.parse(require('fs').readFileSync('locale/en.json','utf8')); JSON.parse(require('fs').readFileSync('locale/zh.json','utf8')); console.log('locale OK')"
      - name: Offline test suites
        run: |
          node test/provider.test.mjs
          node test/edge-cases.test.mjs
      - name: Pack integrity
        run: |
          npm pack --dry-run
