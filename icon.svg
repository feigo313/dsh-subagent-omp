<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Adapted from the Oh My Pi project logo (assets/icon.svg): Pi symbol
       with plugin connector, recolored to a dark tile and square viewBox. -->
  <rect width="36" height="36" rx="7" fill="#0d0d0d"/>
  <!-- Horizontal bar -->
  <rect x="7" y="8.4" width="22" height="3.4" rx="0.8" fill="#fafafa"/>
  <!-- Left leg -->
  <rect x="10.4" y="11.8" width="3.4" height="16.8" rx="0.8" fill="#fafafa"/>
  <!-- Right leg -->
  <rect x="19.6" y="11.8" width="3.4" height="12.2" rx="0.8" fill="#fafafa"/>
  <!-- Plugin connector -->
  <rect x="18.6" y="20.4" width="5.4" height="4.3" rx="0.9" fill="#f97316"/>
  <rect x="19.9" y="21.5" width="0.9" height="2.1" rx="0.3" fill="#0d0d0d"/>
  <rect x="21.4" y="21.5" width="0.9" height="2.1" rx="0.3" fill="#0d0d0d"/>
  <!-- Decorative dots -->
  <circle cx="9.6" cy="10.1" r="0.65" fill="#f97316" opacity="0.8"/>
  <circle cx="26.4" cy="10.1" r="0.65" fill="#f97316" opacity="0.8"/>
</svg>
